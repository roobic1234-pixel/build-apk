name: Build Signed Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project
      run: unzip daneshino.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # این مرحله جدید اضافه شده تا خودش Gradle رو نصب کنه
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        # پیدا کردن مسیر اصلی پروژه با استفاده از فایل settings.gradle
        PROJECT_DIR=$(dirname $(find . -name "settings.gradle*" | head -n 1))
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        echo "$KEYSTORE_BASE64" | base64 -d > "$PROJECT_DIR/daneshino-release.jks"

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd "$PROJECT_DIR"
        # اگر فایل gradlew بود از اون استفاده کن، اگر نبود از دستور gradle استفاده کن
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleRelease
        else
          echo "فایل gradlew پیدا نشد، استفاده از Gradle نصب شده..."
          gradle assembleRelease
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Release-APK
        path: '**/build/outputs/apk/release/*.apk'
