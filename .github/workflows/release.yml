name: Build Signed Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # پسوردها را با پیشوند ORG_GRADLE_PROJECT_ تعریف می‌کنیم
    env:
      ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project
      run: unzip daneshino.zip

    # اصلاح نام کی‌استور
    - name: Fix Keystore Name
      run: |
        find . -name "build.gradle.kts" -exec sed -i 's/my-upload-key.jks/daneshino-release.jks/g' {} +

    # اصلاح نحوه خواندن پسوردها در فایل build.gradle.kts
    - name: Fix Gradle Signing Config
      run: |
        find . -name "build.gradle.kts" -exec sed -i 's/System.getenv("KEYSTORE_PASSWORD")/project.property("KEYSTORE_PASSWORD") as String/g' {} +
        find . -name "build.gradle.kts" -exec sed -i 's/System.getenv("KEY_ALIAS")/project.property("KEY_ALIAS") as String/g' {} +
        find . -name "build.gradle.kts" -exec sed -i 's/System.getenv("KEY_PASSWORD")/project.property("KEY_PASSWORD") as String/g' {} +

    # حذف پلاگین foojay
    - name: Remove foojay plugin from settings
      run: |
        find . -name "settings.gradle.kts" -exec sed -i '/foojay-resolver-convention/d' {} +

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        PROJECT_DIR=$(dirname $(find . -name "settings.gradle*" | head -n 1))
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        echo "$KEYSTORE_BASE64" | base64 -d > "$PROJECT_DIR/daneshino-release.jks"

    - name: Build Release APK
      run: |
        cd "$PROJECT_DIR"
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleRelease
        else
          gradle assembleRelease
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Release-APK
        path: '**/build/outputs/apk/release/*.apk'
