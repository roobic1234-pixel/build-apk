name: Build Signed Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project
      run: unzip daneshino.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        # پیدا کردن مسیر اصلی پروژه و ساخت کی‌استور در همان مسیر
        GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
        echo "$KEYSTORE_BASE64" | base64 -d > "$GRADLE_DIR/daneshino-release.jks"

    - name: Grant execute permission for gradlew
      run: |
        # پیدا کردن پوشه اصلی و دادن دسترسی اجرا
        GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
        chmod +x "$GRADLE_DIR/gradlew"

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # رفتن به پوشه اصلی و شروع بیلد
        GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
        cd "$GRADLE_DIR"
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Release-APK
        # این مسیر همه پوشه‌ها رو میگرده تا فایل APK رو پیدا کنه
        path: '**/build/outputs/apk/release/*.apk'
